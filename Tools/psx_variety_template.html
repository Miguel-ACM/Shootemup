<title>Shootemup Sound Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Console sound-test list: each cue is one row of distinct PSX designs plus the sound in game,
   with a per-cue pitch knob that is saved with the pick. Single dark look by choice. */
:root {
  --bg: #0e0f14; --panel: #171922; --panel-hi: #20232f; --line: #2a2d3a; --text: #e9e6dc; --muted: #8f8c84;
  --full: #ffb347; --soft: #9fb4ff; --cur: #b9b3a6; --pick: #ffe08a;
  --display: 'Silkscreen', ui-monospace, monospace; --body: 'IBM Plex Sans', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
h1 { font: 400 18px var(--display); margin: 0; letter-spacing: .04em; color: var(--pick); }
#round, #count { font: 400 12px var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
header label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
#status { color: var(--muted); font-size: 12px; margin-left: auto; }
main { padding-block: 4px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: auto; }
h2 { font: 400 12px var(--display); letter-spacing: .12em; color: var(--muted); margin: 22px 0 8px; }
.cue { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 6px 0;
  display: grid; grid-template-columns: 140px 1fr 150px; gap: 10px; align-items: center; }
.cue.done { border-color: color-mix(in srgb, var(--pick) 40%, var(--line)); }
.cue > div { min-width: 0; }
.cue b { font-weight: 600; }
.cue small { display: block; color: var(--muted); font-size: 12px; }
.pads { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
.pad { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; min-width: 0; }
.pad button { background: transparent; border: 0; color: inherit; font: 13px var(--body); cursor: pointer; padding: 7px 6px; }
.pad .play { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .pick { border-left: 1px solid var(--line); width: 28px; flex: none; color: var(--muted); }
.pad .play:hover, .pad .pick:hover { background: var(--panel-hi); }
.pad.full { color: var(--full); } .pad.soft { color: var(--soft); } .pad.current { color: var(--cur); }
.pad.last .play { background: color-mix(in srgb, var(--text) 6%, transparent); }
.pad.chosen { border-color: var(--pick); background: color-mix(in srgb, var(--pick) 12%, transparent); }
.pad.chosen .pick { color: var(--pick); }
.pad.disabled { opacity: .35; }
.pad.disabled button { cursor: default; }
.pitch { display: grid; grid-template-columns: 1fr 44px; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.pitch input { width: 100%; accent-color: var(--pick); }
.pitch output { font: 400 11px var(--display); text-align: right; font-variant-numeric: tabular-nums; cursor: pointer; }
.pitch output.moved { color: var(--pick); }
button:focus-visible { outline: 2px solid var(--pick); outline-offset: -2px; }
@media (max-width: 900px) { .cue { grid-template-columns: 1fr; } .pads { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>

<header>
  <h1>Sound Picks</h1><span id="round">PSX variety round</span>
  <span id="count">0 / 0</span>
  <label><input id="rapid" type="checkbox"> Rapid fire</label>
  <label>Volume <input id="vol" type="range" min="0" max="1" step=".01" value=".7"></label>
  <span id="status">Loading picks…</span>
</header>
<main id="list"></main>

<script>
const CUES = /*CUES*/[];
const COLLECTION = 'picks4';
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const master = ctx.createGain(); master.connect(ctx.destination);
const buffers = {};
let live = [];
const picks = {};   // id -> { choice, pitch }
const pitch = {};   // id -> semitones currently on the knob
let db = null;

const vol = document.getElementById('vol');
const rapid = document.getElementById('rapid');
const status = document.getElementById('status');
vol.oninput = () => master.gain.value = +vol.value; vol.oninput();

async function load(file) {
  if (!buffers[file]) buffers[file] = fetch('audio/' + file).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
  return buffers[file];
}
function stopAll() { live.forEach(s => { try { s.stop(); } catch (e) {} }); live = []; }
addEventListener('keydown', e => { if (e.key === 'Escape') stopAll(); });
addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });

const rate = st => Math.pow(2, st / 12);
async function play(cue, seg, at = 0) {
  await ctx.resume();
  const buf = await load(cue.file);
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buf; src.playbackRate.value = rate(pitch[cue.id] || 0);
  g.gain.value = Math.min(.12 / seg.level, 4);
  src.connect(g); g.connect(master); src.start(ctx.currentTime + at, seg.start, seg.dur);
  live.push(src); src.onended = () => live = live.filter(s => s !== src);
}
async function audition(cue, key) {
  stopAll();
  rows[cue.id].last = key; render(cue.id);
  const seg = key === 'current' ? cue.current : cue.options[key];
  if (rapid.checked) {
    const interval = cue.repeat || .18;
    await load(cue.file);
    for (let i = 0; i < Math.round(2.4 / interval); i++) play(cue, seg, i * interval * (1 + (Math.random() - .5) * .1));
  } else play(cue, seg);
}

const rows = {};
function render(id) {
  const r = rows[id], p = picks[id];
  r.el.classList.toggle('done', !!p);
  r.pads.forEach((pad, key) => { pad.classList.toggle('chosen', p?.choice === key); pad.classList.toggle('last', r.last === key); });
  const st = pitch[id] || 0;
  r.knob.value = st;
  r.out.textContent = (st > 0 ? '+' : '') + st;
  r.out.classList.toggle('moved', st !== 0);
  const done = CUES.filter(c => picks[c.id]).length;
  document.getElementById('count').textContent = `${done} / ${CUES.length}`;
}

async function save(id) {
  try { localStorage.setItem('soundPicks4', JSON.stringify(picks)); } catch (e) {}
  if (!db) return;
  try {
    if (picks[id]) await db.doc(COLLECTION + '/' + id).set(picks[id]);
    else await db.doc(COLLECTION + '/' + id).delete();
    status.textContent = 'Saved';
  } catch (e) { status.textContent = 'Not saved: ' + (e.message || e.code); }
}
function choose(id, key) {
  if (picks[id]?.choice === key) delete picks[id];
  else picks[id] = { choice: key, pitch: pitch[id] || 0 };
  render(id); save(id);
}
function setPitch(id, st) {
  pitch[id] = st;
  if (picks[id]) { picks[id].pitch = st; save(id); }
  render(id);
}

const groups = {};
CUES.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
const list = document.getElementById('list');
for (const [group, cues] of Object.entries(groups)) {
  const h = document.createElement('h2'); h.textContent = group; list.appendChild(h);
  for (const c of cues) {
    const el = document.createElement('div'); el.className = 'cue';
    el.innerHTML = `<div><b></b><small></small></div><div class="pads"></div>
      <label class="pitch"><input type="range" min="-12" max="12" step="1" value="0"><output title="Reset">0</output></label>`;
    el.querySelector('b').textContent = c.label;
    el.querySelector('small').textContent = c.id;
    const padsEl = el.querySelector('.pads');
    const pads = new Map();
    const addPad = (key, label, seg, cls, title) => {
      const pad = document.createElement('div'); pad.className = 'pad ' + cls + (seg ? '' : ' disabled');
      if (title) pad.title = title;
      const p = document.createElement('button'); p.className = 'play'; p.textContent = '▶ ' + label;
      const k = document.createElement('button'); k.className = 'pick'; k.textContent = '✓'; k.setAttribute('aria-label', 'Pick ' + label + ' for ' + c.label);
      if (seg) { p.onclick = () => audition(c, key); k.onclick = () => choose(c.id, key); } else p.disabled = k.disabled = true;
      pad.append(p, k); padsEl.appendChild(pad); pads.set(key, pad);
    };
    const takes = Object.entries(c.options);
    takes.forEach(([key, t]) => addPad(key, key, t, t.strength < 1 ? 'soft' : 'full', t.text));
    for (let i = takes.length; i < 8; i++) padsEl.appendChild(document.createElement('span'));
    addPad('current', 'Game', c.current, 'current', 'The sound in game now');
    const knob = el.querySelector('.pitch input'), out = el.querySelector('.pitch output');
    knob.setAttribute('aria-label', 'Pitch in semitones for ' + c.label);
    knob.oninput = () => setPitch(c.id, +knob.value);
    knob.onchange = () => { const r = rows[c.id]; if (r.last) audition(c, r.last); };
    out.onclick = () => { setPitch(c.id, 0); const r = rows[c.id]; if (r.last) audition(c, r.last); };
    rows[c.id] = { el, pads, knob, out, last: null };
    list.appendChild(el);
  }
}

function adopt(saved) {
  for (const k of Object.keys(picks)) delete picks[k];
  for (const [id, v] of Object.entries(saved)) if (rows[id] && v?.choice) { picks[id] = { choice: v.choice, pitch: +v.pitch || 0 }; pitch[id] = picks[id].pitch; }
  CUES.forEach(c => render(c.id));
}
try { adopt(JSON.parse(localStorage.getItem('soundPicks4') || '{}')); } catch (e) { CUES.forEach(c => render(c.id)); }

(async () => {
  db = (await window.claude?.use?.('db')) ?? null;
  if (!db) { status.textContent = 'Picks stay in this browser'; return; }
  db.collection(COLLECTION).onSnapshot(snap => {
    const saved = {}; snap.docs.forEach(d => saved[d.id] = d.data());
    adopt(saved);
    status.textContent = 'Picks saved';
  }, () => { status.textContent = 'Picks stay in this browser'; db = null; });
})();
</script>
